<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk - K3 Monitoring Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

    <div class="container-fluid min-vh-100 d-flex align-items-stretch">
        <div class="row w-100 g-0">
            <!-- Sisi Kiri: Branding -->
            <div class="col-lg-5 d-none d-lg-flex flex-column justify-content-center align-items-start p-5 bg-dark text-white auth-hero">
                <img src="img/LOGO PLN ICONPLUS PUTIH.png" alt="Logo PLN Icon Plus" class="mb-4" style="max-width: 200px;">
                <h2 class="fw-bold" style="font-size: 22px; color: #00a0e9;">K3 MONITORING DASHBOARD</h2>
                <p class="text-secondary" style="font-size: 14px;">Platform pemantauan dan manajemen keselamatan kerja!</p>
            </div>

            <div class="col-lg-7 vh-100 overflow-y-auto bg-white p-4 p-md-5">
                <div class="auth-card w-100 mx-auto" style="max-width: 500px; padding-top: 2rem; padding-bottom: 2rem;">
                    <div class="mb-4 text-center">
                        <h2 class="fw-bold mb-1" style="font-size: 18px;">Selamat Datang Kembali!</h2>
                        <p style="font-size: 12px;">Silakan lengkapi data di bawah ini.</p>
                    </div>

                    <form id="registerForm" class="row g-3">
                        <div class="col-12">
                            <label class="form-label fw-semibold" style="font-size: 12px;">Username</label>
                            <input type="text" id="username" class="form-control shadow-none" style="font-size: 12px;" placeholder="Masukkan Username..." required>
                        </div>

                        <div class="col-12">
                            <label class="form-label fw-semibold" style="font-size: 12px;">Kata Sandi</label>
                            <div class="input-group">
                                <input type="password" id="password" class="form-control shadow-none" style="font-size: 12px;" placeholder="Kata Sandi" required>
                                <span class="input-group-text bg-transparent border-start-0 toggle-password" style="cursor: pointer;">
                                    <i class="fa-regular fa-eye"></i>
                                </span>
                            </div>
                            <div class="text-end mt-1">
                                <a href="lupa_kata_sandi.html" class="text-decoration-none fw-medium" style="color: #00a0e9; font-size: 11px;">Lupa Kata Sandi?</a>
                            </div>
                        </div>
                        
                        <div class="col-12">
                            <p class="text-muted" style="font-size: 12px;">
                                Minimal 6 karakter: kombinasi angka, huruf, dan simbol (!$@%).
                            </p>
                        </div>

                        <div class="col-12 mt-4">
                            <button type="submit" id="btnSimpan" class="btn btn-sm w-100 py-2 fw-bold text-uppercase text-white" style="background-color: #00a0e9; font-size: 12px;">Masuk</button>
                        </div>

                        <div id="message" class="col-12 text-center mt-3 small"></div>

                        <div class="col-12 text-center mt-4 border-top pt-3">
                            <span class="text-muted small" style="font-size: 12px;">Belum punya akun?</span> 
                            <a href="daftar.html" class="text-decoration-none" style="color: #00a0e9; font-size: 12px;">Daftar</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    
    <script src="js/masuk.js"></script>
</body>
</html>
