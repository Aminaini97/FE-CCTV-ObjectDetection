<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K3 Monitoring Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css"> </head>
<body class="bg-light">

<div class="container-fluid py-4">
    <h3 class="fw-bold mb-3">Sistem Pemantauan Alat Pelindung Diri (APD)</h3>
    <div class="row">
        <div class="col-lg-9">
            <div class="row g-3">
                <div class="col-md-6">
                    <div class="card shadow-sm border-0 h-100">
                        <div class="ratio ratio-16x9 bg-black position-relative">
                            <div class="position-absolute top-0 start-0 m-2"><span class="badge bg-danger">LIVE</span></div>
                            <div class="position-absolute top-0 end-0 m-2"><span class="badge bg-dark">CH-01</span></div>
                        </div>
                        <div class="card-body p-2">
                            <h6 class="fw-bold mb-1">Kamera Depan (Gerbang Utama)</h6>
                            <div class="d-flex justify-content-between align-items-center">
                                <span class="text-primary small"><i class="bi bi-check-circle-fill"></i> Area Aman</span>
                                <small class="text-muted"><i class="bi bi-broadcast"></i> 30 FPS</small>
                            </div>
                        </div>
                    </div>
                </div>
                </div>
        </div>

        <div class="col-lg-3">
            <div class="card shadow-sm p-3">
                <h6 class="fw-bold border-bottom pb-2">KONTROL KAMERA (PTZ)</h6>
                <label class="small text-muted">Pilih Fokus Kamera</label>
                <select class="form-select form-select-sm mb-3">
                    <option>CH-01 - Kamera Depan</option>
                </select>
                
                <div class="text-center">
                    <div class="d-grid gap-2 d-md-block">
                        <button class="btn btn-outline-secondary btn-sm mb-1"><i class="bi bi-arrow-up"></i></button><br>
                        <button class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left"></i></button>
                        <button class="btn btn-outline-secondary btn-sm"><i class="bi bi-record-circle"></i></button>
                        <button class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-right"></i></button><br>
                        <button class="btn btn-outline-secondary btn-sm mt-1"><i class="bi bi-arrow-down"></i></button>
                    </div>
                </div>
                
                <h6 class="fw-bold mt-4">Zoom Magnifikasi</h6>
                <div class="btn-group w-100">
                    <button class="btn btn-outline-secondary btn-sm"><i class="bi bi-zoom-in"></i> In</button>
                    <button class="btn btn-outline-secondary btn-sm"><i class="bi bi-zoom-out"></i> Out</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
