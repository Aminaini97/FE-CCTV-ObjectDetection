<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log Riwayat - K3 Monitoring Dashboard</title>

    <!-- Sinkronisasi Tema Global Sebelum Rendering Elemen -->
    <script>
        (function () {
            const currentTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-bs-theme', currentTheme);
        })();
    </script>

    <!-- Core CSS Libraries -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <link class="master-style" rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-custom sticky-top">
        <div class="container-fluid d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center gap-3">
                <button class="btn btn-light d-lg-none" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebarMobile">
                    <i class="bi bi-list fs-4"></i>
                </button>
                
                <div class="d-flex align-items-center">
                    <img src="img/logo-pln-icon.png" alt="PLN Logo" class="me-3" style="height: 40px; width: auto; object-fit: contain;">
                </div>
                <h1 class="brand-title d-none d-sm-block">K3 MONITORING DASHBOARD</h1>
            </div>

            <div class="d-flex align-items-center gap-3">
                <a href="profile.html" class="text-decoration-none">
                    <div class="rounded-circle d-flex align-items-center justify-content-center border" style="width: 35px; height: 35px; background-color: var(--bg-light);">
                        <i class="bi bi-person-fill text-secondary fs-5"></i>
                    </div>
                </a>
            </div>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <nav class="col-lg-2 d-none d-lg-block sidebar-wrapper sidebar">
                <div class="nav flex-column">
                    <a href="dashboard.html" class="nav-link active"><i class="bi bi-house-door-fill"></i> Dashboard</a>
                    <a href="daftar_kamera.html" class="nav-link"><i class="bi bi-camera-video-fill"></i> Daftar Kamera</a>
                    <a href="log_riwayat.html" class="nav-link"><i class="bi bi-clock-history"></i> Log Riwayat</a>
                    <a href="pengaturan.html" class="nav-link"><i class="bi bi-gear-fill"></i> Pengaturan</a>
                </div>
            </nav>

            <div class="offcanvas offcanvas-start" tabindex="-1" id="sidebarMobile">
                <div class="offcanvas-header border-bottom">
                    <h5 class="offcanvas-title brand-title">Menu</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
                </div>
                <div class="offcanvas-body p-0 pt-2">
                    <div class="nav flex-column">
                        <a href="dashboard.html" class="nav-link active"><i class="bi bi-house-door-fill"></i> Dashboard</a>
                        <a href="daftar_kamera.html" class="nav-link"><i class="bi bi-camera-video-fill"></i> Daftar Kamera</a>
                        <a href="log_riwayat.html" class="nav-link"><i class="bi bi-clock-history"></i> Log Riwayat</a>
                        <a href="pengaturan.html" class="nav-link"><i class="bi bi-gear-fill"></i> Pengaturan</a>
                    </div>
                </div>
            </div>

            <main class="col-lg-10 col-12 py-3 px-md-3">
                <div class="row g-4">
                    <div class="col-lg-12">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h4 class="fw-bold m-0" style="font-size: 12px;">DASHBOARD MONITORING APD</h4>
                            <div>
                                <button class="btn btn-sm btn-outline-secondary" style="padding: 1px 6px; font-size: 10px;" onclick="changePage(-1)"><i class="bi bi-chevron-left"></i></button>
                                <button class="btn btn-sm btn-outline-secondary" style="padding: 1px 6px; font-size: 10px;" onclick="changePage(1)"><i class="bi bi-chevron-right"></i></button>
                            </div>
                        </div>
                        <div id="cctv-grid" class="row g-3">
                            </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <div class="modal fade" id="cameraModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-fullscreen">
            <div class="modal-content bg-black">
                <div class="position-absolute p-3" style="top:0; right:0; z-index: 1000;">
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>

                <div class="modal-body p-0 d-flex align-items-center justify-content-center position-relative">
                    <div class="w-100 h-100 d-flex align-items-center justify-content-center bg-dark">
                        <span class="text-secondary">Stream Video Fullscreen</span>
                    </div>

                    <div class="position-absolute bottom-0 w-100 p-4 d-flex justify-content-between align-items-end">
                        <div class="text-white">
                            <h4 id="modalTitle" class="m-0 fw-bold" style="font-size: 14px;">Nama Kamera</h4>
                            <p id="modalLocation" class="text-secondary m-0" style="font-size: 12px;"></p>
                        </div>

                        <div class="d-flex gap-3 align-items-center bg-dark bg-opacity-50 p-3 rounded">
                            <div class="d-flex flex-column align-items-center">
                                <button class="btn btn-sm btn-light mb-1" onclick="console.log('Up')"><i class="bi bi-chevron-up"></i></button>
                                <div class="d-flex gap-1">
                                    <button class="btn btn-sm btn-light" onclick="console.log('Left')"><i class="bi bi-chevron-left"></i></button>
                                    <button class="btn btn-sm btn-light" onclick="console.log('Right')"><i class="bi bi-chevron-right"></i></button>
                                </div>
                                <button class="btn btn-sm btn-light mt-1" onclick="console.log('Down')"><i class="bi bi-chevron-down"></i></button>
                            </div>
                            
                            <div class="d-flex flex-column gap-2">
                                <button class="btn btn-sm btn-outline-light" onclick="console.log('Zoom In')"><i class="bi bi-plus-lg"></i></button>
                                <button class="btn btn-sm btn-outline-light" onclick="console.log('Zoom Out')"><i class="bi bi-dash-lg"></i></button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
