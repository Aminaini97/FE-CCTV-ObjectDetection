<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - K3 Monitoring Dashboard</title>
    
    <script>
        (function () {
            const currentTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-bs-theme', currentTheme);
        })();
    </script>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-custom sticky-top">
        <div class="container-fluid d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center gap-3">
                <button class="btn btn-light d-lg-none" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebarMobile">
                    <i class="bi bi-list fs-4"></i>
                </button>
                
                <div class="d-flex align-items-center">
                    <img src="img/logo-pln-icon.png" alt="PLN Logo" class="me-3" style="height: 40px; width: auto; object-fit: contain;">
                </div>
                <h1 class="brand-title d-none d-sm-block">K3 MONITORING DASHBOARD</h1>
            </div>

            <div class="d-flex align-items-center gap-3">
                <a href="profile.html" class="text-decoration-none">
                    <div class="rounded-circle d-flex align-items-center justify-content-center border" style="width: 35px; height: 35px; background-color: var(--bg-light);">
                        <i class="bi bi-person-fill text-secondary fs-5"></i>
                    </div>
                </a>
            </div>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <nav class="col-lg-2 d-none d-lg-block sidebar-wrapper sidebar">
                <div class="nav flex-column">
                    <a href="dashboard.html" class="nav-link"><i class="bi bi-house-door-fill"></i> Dashboard</a>
                    <a href="daftar_kamera.html" class="nav-link"><i class="bi bi-camera-video-fill"></i> Daftar Kamera</a>
                    <a href="log_riwayat.html" class="nav-link"><i class="bi bi-clock-history"></i> Log Riwayat</a>
                    <a href="pengaturan.html" class="nav-link"><i class="bi bi-gear-fill"></i> Pengaturan</a>
                </div>
            </nav>

            <div class="offcanvas offcanvas-start" tabindex="-1" id="sidebarMobile">
                <div class="offcanvas-header border-bottom">
                    <h5 class="offcanvas-title brand-title">Menu</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
                </div>
                <div class="offcanvas-body p-0 pt-2">
                    <div class="nav flex-column">
                        <a href="dashboard.html" class="nav-link"><i class="bi bi-house-door-fill"></i> Dashboard</a>
                        <a href="daftar_kamera.html" class="nav-link"><i class="bi bi-camera-video-fill"></i> Daftar Kamera</a>
                        <a href="log_riwayat.html" class="nav-link"><i class="bi bi-clock-history"></i> Log Riwayat</a>
                        <a href="pengaturan.html" class="nav-link"><i class="bi bi-gear-fill"></i> Pengaturan</a>
                    </div>
                </div>
            </div>
            
            <main class="col-lg-10 col-12 py-3 px-md-3">
                <h4 class="fw-bold mb-3" style="font-size: 14px;">PROFILE</h4>
                
                <div class="row">
                    <div class="col-xl-12 col-lg-12 mx-auto">
                        <div class="card border-0 shadow-sm p-4">
                            <div class="row align-items-stretch">
                                
                                <div class="col-md-5 text-center border-end">
                                    <h6 class="mb-3" style="font-size: 12px;">Foto Profil</h6>
                                    <div class="photo-box border rounded-3 mx-auto mb-3 d-flex flex-column align-items-center justify-content-center"
                                         id="btnPilihFoto"
                                         style="width: 220px; height: 300px; background-color: var(--bg-light); cursor: pointer;">
                                        <div id="preview_pelaku" class="text-center">
                                            <i class="bi bi-person-bounding-box" style="font-size: 50px; color: dimgrey;"></i>
                                            <p class="mt-2 mb-0" style="font-size: 12px; color: dimgrey;">Klik Unggah Foto</p>
                                        </div>
                                        <input type="file" id="data_foto_pelaku" class="d-none" accept="image/*">
                                    </div>
                                    <p class="text-muted mb-0" style="font-size: 12px;">Format: JPG, PNG (Maks. 1MB)</p>
                                </div>

                                <div class="col-md-7 ps-md-4 mt-4 mt-md-0">
                                    <form id="profileForm">
                                        <h6 class="fw-bold mb-4 border-bottom pb-2" style="font-size: 12px;">Detail Pengguna</h6>
                                        
                                        <div class="row mb-3 align-items-center">
                                            <label class="col-sm-4 fw-medium text-muted" style="font-size: 12px;">Nama Instansi</label>
                                            <div class="col-sm-8">
                                                <input type="text" id="nama_instansi" class="form-control form-control-sm" style="font-size: 12px; background-color: var(--bg-light); color: var(--text-dark); border-color: var(--border-color);" placeholder="Masukkan Nama Instansi" required>
                                            </div>
                                        </div>
                                        <div class="row mb-3 align-items-center">
                                            <label class="col-sm-4 fw-medium text-muted" style="font-size: 12px;">Alamat Instansi</label>
                                            <div class="col-sm-8">
                                                <input type="text" id="alamat_instansi" class="form-control form-control-sm" style="font-size: 12px; background-color: var(--bg-light); color: var(--text-dark); border-color: var(--border-color);" placeholder="Masukkan Alamat Instansi" required>
                                            </div>
                                        </div>

                                        <h6 class="fw-bold mt-4 mb-4 border-bottom pb-2" style="font-size: 12px;">Detail Akun</h6>
                                        <div class="row mb-3 align-items-center">
                                            <label class="col-sm-4 fw-medium text-muted" style="font-size: 12px;">Username</label>
                                            <div class="col-sm-8">
                                                <input type="text" id="username" class="form-control form-control-sm" style="font-size: 12px; background-color: var(--bg-light); color: var(--text-dark); border-color: var(--border-color);" placeholder="Username" required>
                                            </div>
                                        </div>
                                        <div class="row mb-3 align-items-center">
                                            <label class="col-sm-4 fw-medium text-muted" style="font-size: 12px;">Email</label>
                                            <div class="col-sm-8">
                                                <input type="text" id="email" class="form-control form-control-sm" style="font-size: 12px; background-color: var(--bg-light); color: var(--text-dark); border-color: var(--border-color);" placeholder="Email" required>
                                            </div>
                                        </div>
                                        <div class="row mb-3 align-items-center">
                                            <label class="col-sm-4 fw-medium text-muted" style="font-size: 12px;">Nomor Telepon</label>
                                            <div class="col-sm-8">
                                                <input type="text" id="nomor_telepon" class="form-control form-control-sm" style="font-size: 12px; background-color: var(--bg-light); color: var(--text-dark); border-color: var(--border-color);" placeholder="Masukkan Nomor Telepon" required>
                                            </div>
                                        </div>

                                        <div class="d-flex justify-content-end gap-2 mt-4">
                                            <button type="button" class="btn btn-sm btn-outline-secondary px-4" id="btnBatal" style="font-size: 12px;">Batal</button>
                                            <button type="submit" class="btn btn-sm text-white px-4" id="btnSimpan" style="background-color: #00a0e9; font-size: 12px;">Simpan</button>
                                        </div>
                                    </form>
                                </div>

                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/profile.js"></script>
</body>
</html>
